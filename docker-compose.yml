# Production stack: postgres + backend + frontend. `docker compose up --build`.
# Set JWT_SECRET (and POSTGRES_PASSWORD if you change it) via a .env file next to this one.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: archboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-archboard}
      POSTGRES_DB: archboard
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://archboard:${POSTGRES_PASSWORD:-archboard}@postgres:5432/archboard
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env for production}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
      UPLOAD_DIR: /app/backend/uploads
      PORT: 4000
    volumes:
      - uploads:/app/backend/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:4000
    ports:
      - "3000:3000"

volumes:
  db-data:
  uploads:
